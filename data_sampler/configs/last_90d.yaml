source_dir: simulation_engine/output/tables
output_dir: data
random_seed: 42

date_window:
  anchor: latest        # max(orders.created_at) — 2024-06-30
  days: 90

stratify_by: [month, channel, status]

target_rows: 100000     # target orders per sample; null = full 50/50 split (~120k each)
tolerance: 0.10         # ±10% band → 90k–110k rows accepted

samples:
  - name: sample_a
    split: even
  - name: sample_b
    split: odd

tables:
  # ── Anchor (split is computed here) ──────────────────────────────────────
  - name: orders
    filter: date_window
    split_anchor: true

  # ── Per-sample event tables (must be listed in dependency order) ─────────
  - name: order_lines
    join: {parent: orders, key: order_id}

  - name: invoices
    join: {parent: orders, key: order_id}

  - name: payments
    join: {parent: invoices, key: invoice_id}   # two-hop: invoices → payments

  - name: stockout_events
    join: {parent: orders, key: order_id}
    filter: date_window   # event table: date-filter first (~960k → ~480k), then join

  - name: credit_ledger
    join: {parent: orders, key: customer_id}
    filter: date_window   # event table: date-filter first (~456k → ~228k), then join

  - name: customer_history
    join: {parent: orders, key: customer_id}
    filter: date_window

  - name: rep_performance
    join: {parent: orders, key: rep_id}

  - name: customers
    join: {parent: orders, key: customer_id}

  - name: rfm_scores
    join: {parent: orders, key: customer_id}

  # ── Static reference tables (written once to data/reference/) ────────────
  - name: inventory_snapshot
    static: true

  - name: monthly_customer_snapshot
    static: true

  - name: promotion_roi
    static: true
